---
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    # Blocking: load-failure and syntax-check are unskippable, so a file that
    # cannot be parsed fails the build (the aursu.lvm_setup 1.3.0 lesson).
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/aursu/dockerinstall

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: pip install --disable-pip-version-check ansible-lint

      - name: Lint the roles
        working-directory: ansible_collections/aursu/dockerinstall
        run: ansible-lint roles/
