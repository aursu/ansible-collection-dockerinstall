---
# Exact version of every Docker package, as apt spells it. Required: the role
# refuses to run with an empty map, because a version the repository dropped is
# the intended signal to bump the pin, and an unpinned install hides it.
#   docker_packages:
#     docker-ce: "5:29.9.3-1~ubuntu.24.04~noble"
docker_packages: {}

# Installed first: what the role's own modules need on the host
# (ansible.builtin.deb822_repository needs python3-debian).
docker_prerequisite_packages:
  - python3-debian

docker_repo_url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
docker_repo_components:
  - stable
docker_repo_architectures:
  - amd64

# The whole of /etc/docker/daemon.json. The file is owned by this role; keys
# not listed here are not kept.
docker_daemon_config:
  log-driver: local
  live-restore: true
