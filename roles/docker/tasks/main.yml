---
- name: Refuse a platform this role does not cover yet
  ansible.builtin.assert:
    that: ansible_facts.os_family == 'Debian'
    fail_msg: "aursu.dockerinstall.docker supports Debian and Ubuntu only, not {{ ansible_facts.distribution }}"
    quiet: true

- name: Refuse unpinned packages
  ansible.builtin.assert:
    that:
      - docker_packages | length > 0
      - docker_packages.values() | select('string') | select | list | length == docker_packages | length
    fail_msg: "docker_packages must map each package to an exact version string"
    quiet: true

- name: Ensure the tools this role's modules need are installed
  ansible.builtin.apt:
    name: "{{ docker_prerequisite_packages }}"
    state: present

- name: Docker apt repository
  ansible.builtin.import_tasks: repository.yml

- name: Docker packages and service
  ansible.builtin.import_tasks: packages.yml

- name: Docker daemon configuration
  ansible.builtin.import_tasks: daemon.yml
